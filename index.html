<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
/* Layout: one column for the phone, big type, color = type of contact, fixed bottom tabs for the thumb */
:root{
  --bg:#F4F7F5; --card:#FFFFFF; --fg:#111714; --muted:#45524B; --line:#CBD5CF;
  --cap:#0A6B3A; --cap-soft:#DDF2E6;
  --par:#1D4DB5; --par-soft:#E0E9FB;
  --gov:#76288A; --gov-soft:#F1E2F5;
  --esc:#A84A06; --esc-soft:#FBE8D8;
  --hot:#C0122A; --hot-soft:#FCE1E4;
  --out:#4B5852; --out-soft:#E6ECE8;
  --nav:#111714; --nav-fg:#FFFFFF;
  --font:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --base:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --card:#19201C; --fg:#F1F5F2; --muted:#B4C2BA; --line:#34413A;
  --cap:#63D69C; --cap-soft:#163527; --par:#93B4FF; --par-soft:#1A2643;
  --gov:#DDA2EA; --gov-soft:#33203A; --esc:#FFB26B; --esc-soft:#3A2614;
  --hot:#FF7C88; --hot-soft:#3D1A1F; --out:#AEBDB5; --out-soft:#26302B; --nav:#F1F5F2; --nav-fg:#0E1311; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --card:#19201C; --fg:#F1F5F2; --muted:#B4C2BA; --line:#34413A;
  --cap:#63D69C; --cap-soft:#163527; --par:#93B4FF; --par-soft:#1A2643;
  --gov:#DDA2EA; --gov-soft:#33203A; --esc:#FFB26B; --esc-soft:#3A2614;
  --hot:#FF7C88; --hot-soft:#3D1A1F; --out:#AEBDB5; --out-soft:#26302B; --nav:#F1F5F2; --nav-fg:#0E1311; color-scheme:dark}
:root[data-size="2"]{--base:22px}
:root[data-size="3"]{--base:26px}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(5.2rem + env(safe-area-inset-bottom, 0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
.back{align-self:flex-start;border:2px solid var(--fg);background:var(--card);border-radius:.7rem;padding:.5rem .9rem;font-weight:700;cursor:pointer}
main{max-width:46rem;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--par);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-block:1rem .5rem}
.top h1{font-size:1.35rem}
.top small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.size{border:2px solid var(--fg);background:var(--card);border-radius:.6rem;padding:.35rem .7rem;font-weight:700;cursor:pointer;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-block:.25rem 1rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.12rem .6rem;font-size:.78rem;font-weight:700;letter-spacing:.02em;border:2px solid currentColor;white-space:nowrap}
.c-cap{color:var(--cap);background:var(--cap-soft)}
.c-par{color:var(--par);background:var(--par-soft)}
.c-gov{color:var(--gov);background:var(--gov-soft)}
.c-esc{color:var(--esc);background:var(--esc-soft)}
.c-hot{color:var(--hot);background:var(--hot-soft)}
.c-out{color:var(--out);background:var(--out-soft)}
.k-out{--k:var(--out);--ks:var(--out-soft)}
.divider{margin-top:.5rem;padding-top:.75rem;border-top:3px solid var(--fg);font-size:1.15rem}
.view{display:flex;flex-direction:column;gap:1rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.card.hot{border-color:var(--hot);border-width:3px}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem}
.room{font-weight:700;font-size:1.05rem}
.sess{font-size:1.1rem;font-weight:700}
.why{margin:0;color:var(--muted)}
.ppl{display:flex;flex-wrap:wrap;gap:.45rem}
.pbtn{border:2px solid currentColor;border-radius:.6rem;padding:.3rem .65rem;font-weight:700;cursor:pointer;font-size:.9rem;text-align:left}
.alt{border-top:2px dashed var(--line);padding-top:.6rem;display:flex;flex-direction:column;gap:.4rem}
.alt .lbl{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.alt .sess{font-size:1rem}
.pause{background:transparent;border-style:dashed}
.pause .sess{font-weight:400}
.now-label{display:inline-block;background:var(--fg);color:var(--bg);border-radius:.4rem;padding:.1rem .5rem;font-weight:700;font-size:.85rem}
.days{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.daybtn,.fbtn{border:2px solid var(--fg);background:var(--card);border-radius:.7rem;padding:.55rem;font-weight:700;cursor:pointer}
.daybtn[aria-pressed="true"],.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:.4rem}
.fbtn{padding:.35rem .7rem;font-size:.88rem}
.search{width:100%;border:3px solid var(--fg);border-radius:.8rem;padding:.7rem .9rem;background:var(--card);font-size:1.1rem}
.person{border-left:10px solid var(--k)}
.person.flash{box-shadow:0 0 0 4px var(--k)}
.ph{display:flex;gap:.75rem;align-items:center}
.avatar{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;background:var(--ks);color:var(--k);border:3px solid var(--k)}
.ph h3{font-size:1.3rem}
.org{margin:0;color:var(--muted);font-size:.95rem}
.k-cap{--k:var(--cap);--ks:var(--cap-soft)} .k-par{--k:var(--par);--ks:var(--par-soft)}
.k-gov{--k:var(--gov);--ks:var(--gov-soft)} .k-esc{--k:var(--esc);--ks:var(--esc-soft)}
.field{margin:0}
.field b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pitch{background:var(--ks);border-radius:.7rem;padding:.6rem .75rem;margin:0;font-size:1.05rem}
.where{margin:0;padding-left:1.1rem}
.met{display:flex;align-items:center;gap:.5rem;font-weight:700;cursor:pointer}
.met input{width:1.4rem;height:1.4rem;accent-color:var(--k)}
textarea{width:100%;min-height:3.2rem;border:2px solid var(--line);border-radius:.6rem;padding:.5rem;background:var(--bg);resize:vertical}
.metbadge{font-size:.8rem;font-weight:700;color:var(--cap)}
.big{font-size:1.35rem;line-height:1.5;margin:0}
.empty{color:var(--muted);text-align:center;padding:1rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);display:grid;grid-template-columns:repeat(4,1fr);
  padding:.35rem max(8px, env(safe-area-inset-right, 0px)) calc(.35rem + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav.tabs a{color:var(--nav-fg);text-decoration:none;text-align:center;font-weight:700;padding:.65rem .2rem;border-radius:.6rem;font-size:.95rem}
nav.tabs a[aria-current="page"]{background:var(--nav-fg);color:var(--nav)}
@media (prefers-reduced-motion:no-preference){.person.flash{transition:box-shadow .3s}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.split(" ").filter(w=>w.length>2||w===n.split(" ")[0]).map(w=>w[0]).slice(0,2).join("");

function pbtn(id){const x=PM[id];if(!x)return"";const met=store[id]&&store[id].met?" ✓":"";
  return `<button type="button" class="pbtn c-${x.c}" data-go="${id}">${x.p===1?"★ ":""}${esc(x.n)}${met}</button>`}
function slotHTML(sl,label){
  const tm=`<div class="time">${label?`<span class="now-label">${label}</span> `:""}${fmt(sl.s)}–${fmt(sl.e)}</div>`;
  if(sl.pause){return `<article class="card pause">${tm}<p class="sess">${esc(sl.pause)}</p>${sl.ppl?`<div class="ppl">${sl.ppl.map(pbtn).join("")}</div>`:""}</article>`}
  const pk=sl.pick;
  return `<article class="card${sl.hot?" hot":""}">${tm}
   ${sl.hot?`<span class="chip c-hot" style="align-self:flex-start">Imperdível</span>`:""}
   <div class="room">Vá para: ${esc(pk.sala)}</div>
   <div class="sess">${esc(pk.t)}</div>
   <p class="why">${esc(pk.why)}</p>
   ${pk.ppl?`<div class="ppl">${pk.ppl.map(pbtn).join("")}</div>`:""}
   ${(sl.alts||[]).map(a=>`<div class="alt"><span class="lbl">Plano B · ${esc(a.sala)}</span><div class="sess">${esc(a.t)}</div>${a.ppl?`<div class="ppl">${a.ppl.map(pbtn).join("")}</div>`:""}</div>`).join("")}
  </article>`}

const pad=n=>String(n).padStart(2,"0");
const mins=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
function renderAgora(){
  const d=new Date();const iso=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const m=d.getHours()*60+d.getMinutes();
  let out=`<p class="eyebrow">Agora são ${pad(d.getHours())}h${pad(d.getMinutes())}</p>`;
  let day=iso===DAYS.d1.date?"d1":iso===DAYS.d2.date?"d2":null;
  const first3=(k,lbl)=>DAYS[k].slots.slice(0,3).map((s,i)=>slotHTML(s,i===0?lbl:"")).join("");
  if(!day){
    if(iso<DAYS.d1.date){out+=`<h2>O festival começa na quarta, 4/11</h2>`+first3("d1","Começo")}
    else{out+=`<h2>O FIINSA terminou</h2><p>Revise suas anotações na aba Pessoas e mande os e-mails de follow-up.</p>`}
    $("#v-agora").innerHTML=out;return}
  const sl=DAYS[day].slots;const cur=sl.find(x=>m>=mins(x.s)&&m<mins(x.e));
  out+=`<h2>${DAYS[day].label}</h2>`;
  if(m<mins(sl[0].s)){out+=first3(day,"Começo");$("#v-agora").innerHTML=out;return}
  const after=sl.filter(x=>mins(x.s)>m).slice(0,cur?2:3);
  if(cur)out+=slotHTML(cur,"AGORA");
  after.forEach((x,i)=>out+=slotHTML(x,i===0?"DEPOIS":""));
  if(!cur&&!after.length){out+=`<p class="big">Fim do dia.</p>`;if(day==="d1")out+=`<h2>${DAYS.d2.label}</h2>`+first3("d2","Amanhã")}
  $("#v-agora").innerHTML=out}

function renderPessoas(){
  const fl=[["todos","Todos"],["p1","★ Prioridade"],["cap","Capital"],["par","Parceria"],["gov","Governo"],["esc","Escuta"],["out","Demais palestrantes"],["met","Já conversei"]];
  $("#v-pessoas").innerHTML=`${backTo?`<button type="button" class="back" data-back="1">← Voltar para ${backTo==="agenda"?"a Agenda":"Agora"}</button>`:""}

   <input id="busca" class="search" type="search" placeholder="Ex.: BID, Fundo Vale, óculos…" value="${esc(q)}">
   <div class="filters">${fl.map(([k,l])=>`<button type="button" class="fbtn" data-f="${k}" aria-pressed="${k===filt}">${l}</button>`).join("")}</div>
   <div id="plist" class="view"></div>`;

function listPessoas(){
  const qq=q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const r=P.filter(x=>{const s=store[x.id]||{};
    if(filt==="p1"&&x.p!==1)return false; if(["cap","par","gov","esc","out"].includes(filt)&&x.c!==filt)return false; if(filt==="met"&&!s.met)return false;
    if(!qq)return true;
    return (x.n+" "+x.o+" "+x.f+" "+(s.note||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(qq)}).sort((a,b)=>(a.c==="out")-(b.c==="out")||(a.c==="out"?a.n.localeCompare(b.n,"pt"):a.p-b.p));
  let firstOut=r.findIndex(x=>x.c==="out");
  $("#plist").innerHTML=r.length?r.map((x,i)=>(i===firstOut&&i>0?`<h2 class="divider">Demais palestrantes (A–Z)</h2>`:"")+personHTML(x)).join(""):`<p class="empty">Ninguém encontrado. Tente outro nome ou limpe o filtro.</p>`}

const tabs=["agora","agenda","pessoas","pitch"];
let curTab="agora",backTo=null,backY=0;
function show(t){if(!tabs.includes(t))t="agora";
  if(t!=="pessoas")backTo=null; curTab=t;
  tabs.forEach(k=>{$("#v-"+k).hidden=k!==t;const a=document.querySelector(`[data-tab="${k}"]`);if(k===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(t==="agora")renderAgora(); if(t==="agenda")renderAgenda(); if(t==="pessoas")renderPessoas(); if(t==="pitch")renderPitch();
  window.scrollTo(0,0)}
function goPerson(id){if(curTab!=="pessoas"){backTo=curTab;backY=window.scrollY}
  filt="todos";q="";if(location.hash!=="#pessoas"){history.replaceState(null,"","#pessoas")}show("pessoas");
  const el=document.getElementById("p-"+id);if(el){el.scrollIntoView({block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1800)}}

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){e.preventDefault();const t=tb.dataset.tab;try{history.replaceState(null,"","#"+t)}catch(_){}show(t);return}
  const g=e.target.closest("[data-go]");if(g){goPerson(g.dataset.go);return}
  if(e.target.closest("[data-back]")&&backTo){const t=backTo,y=backY;backTo=null;history.replaceState(null,"","#"+t);show(t);window.scrollTo(0,y);return}
  const d=e.target.closest("[data-day]");if(d){agDay=d.dataset.day;renderAgenda();return}
  const f=e.target.closest("[data-f]");if(f){filt=f.dataset.f;document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filt));listPessoas();return}});
document.addEventListener("input",e=>{
  if(e.target.id==="busca"){q=e.target.value;listPessoas();return}
  const n=e.target.dataset.note;if(n){store[n]=Object.assign({},store[n],{note:e.target.value});save()}});
document.addEventListener("change",e=>{const id=e.target.dataset.met;if(id){store[id]=Object.assign({},store[id],{met:e.target.checked});save();
  const card=document.getElementById("p-"+id);if(card){const b=card.querySelector(".metbadge");if(e.target.checked&&!b)card.querySelector(".chip").insertAdjacentHTML("afterend",' <span class="metbadge">✓ Já conversei</span>');if(!e.target.checked&&b)b.remove()}}});

show(location.hash.slice(1)||"agora");
